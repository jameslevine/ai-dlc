# Secret scanning, run unconditionally for every repository.
#
# Deliberately not per-language: a leaked credential does not care what file
# extension it was committed in, so this is the one check that never depends
# on detection having worked.
name: Reusable secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the working tree. A secret that
          # was committed and then removed is still a leaked secret.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inline PR comments would need `pull-requests: write`, and the job
          # summary carries the same information. Keep the token read-only.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # NOTE: gitleaks-action v3 is free for user accounts but requires a
          # GITLEAKS_LICENSE for repositories owned by an organization. Moving
          # a repo into an org will break this job until a licence is set.
