# One build workflow for every language.
#
# It receives a job spec as inputs and runs six named steps, each skipped when
# its command is empty. Adding an ecosystem means adding one guarded setup step
# and one adapter in the CLI; there is still exactly one workflow to version.
#
# WHY ONE JOB RATHER THAN ONE JOB PER ECOSYSTEM
# The runner resolves and downloads every action referenced by a job during
# "Set up job", before any `if:` is evaluated, so the skipped setup steps below
# are still fetched. That costs a few seconds per run. The alternative, a job
# per ecosystem, avoids the download but duplicates the six build steps six
# times over, which is far more to keep correct across a version bump. If that
# download cost ever matters more than the duplication, split this into
# per-ecosystem jobs with `if:` at job level; a skipped job downloads nothing.
#
# Every action is pinned by commit SHA with its tag in a comment. Tags move and
# SHAs do not, and `astral-sh/setup-uv` publishes no moving major tag at all.
name: Reusable language CI

on:
  workflow_call:
    inputs:
      name:
        description: Readable label for this target, used in the job summary.
        type: string
        required: true
      setup:
        description: Toolchain to install; one of none, uv, node, java, go, rust, dotnet.
        type: string
        required: true
      version:
        description: Toolchain version. Empty means the runner default.
        type: string
        required: false
        default: ""
      working-directory:
        type: string
        required: false
        default: "."
      cache:
        description: Lockfile path the setup action keys its cache on.
        type: string
        required: false
        default: ""
      # The six build steps. An empty string skips the step rather than
      # running a no-op, so the log shows only what this project actually does.
      install:
        type: string
        required: false
        default: ""
      lint:
        type: string
        required: false
        default: ""
      format:
        type: string
        required: false
        default: ""
      typecheck:
        type: string
        required: false
        default: ""
      test:
        type: string
        required: false
        default: ""
      build:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -- toolchains ----------------------------------------------------
      # `uses:` cannot take an expression, so each is a separately guarded
      # step rather than one parameterised action.

      - name: Set up Python and uv
        if: inputs.setup == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ inputs.version }}
          cache-dependency-glob: ${{ inputs.cache }}

      - name: Set up Node
        if: inputs.setup == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.version || '22' }}

      - name: Set up Java
        if: inputs.setup == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          # Temurin is pre-cached on the GitHub runner images, so this usually
          # skips the download entirely.
          distribution: temurin
          java-version: ${{ inputs.version || '21' }}
          cache: ${{ contains(inputs.cache, 'pom.xml') && 'maven' || 'gradle' }}

      - name: Set up Go
        if: inputs.setup == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.version || 'stable' }}
          cache-dependency-path: ${{ inputs.cache }}

      - name: Set up Rust
        if: inputs.setup == 'rust'
        # Reads rust-toolchain.toml when no version is given, and wraps
        # Swatinem/rust-cache internally, so no separate cache step is needed.
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ inputs.version }}

      - name: Set up .NET
        if: inputs.setup == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Left empty on purpose when the project has a global.json: the
          # action then installs the version that file pins.
          dotnet-version: ${{ inputs.version }}

      # -- build ---------------------------------------------------------
      # Named individually so a failure names the phase that failed, rather
      # than pointing at one opaque "run everything" step.

      - name: install
        if: inputs.install != ''
        run: ${{ inputs.install }}

      - name: lint
        if: inputs.lint != ''
        run: ${{ inputs.lint }}

      - name: format
        if: inputs.format != ''
        run: ${{ inputs.format }}

      - name: typecheck
        if: inputs.typecheck != ''
        run: ${{ inputs.typecheck }}

      - name: test
        if: inputs.test != ''
        run: ${{ inputs.test }}

      - name: build
        if: inputs.build != ''
        run: ${{ inputs.build }}
