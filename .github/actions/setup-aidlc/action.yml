name: Set up aidlc
description: Install uv and the aidlc CLI at a pinned version.

inputs:
  version:
    description: >-
      Git ref of the aidlc release to install. Defaults to the commit of the
      reusable workflow this job runs, so a consumer pinning the platform to a
      tag gets the CLI from that same tag.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Install aidlc
      shell: bash
      env:
        # `github.job_workflow_sha` is the commit of the reusable workflow this
        # job runs: the commit a consumer's `@v1` resolved to. Using it means
        # the CLI version always matches the platform version a consumer
        # pinned, with nothing to keep in sync by hand. `job_workflow_ref` is
        # an OIDC token claim, not a `github` context property, and reads as
        # empty inside a job.
        REQUESTED: ${{ inputs.version }}
        WORKFLOW_SHA: ${{ github.job_workflow_sha }}
      run: |
        set -euo pipefail
        ref="${REQUESTED:-${WORKFLOW_SHA}}"
        if [ -z "$ref" ]; then
          echo "::error::could not determine which aidlc version to install" >&2
          exit 1
        fi
        echo "Installing aidlc at ${ref}"
        uv tool install "git+https://github.com/jameslevine/ai-dlc@${ref}"
        aidlc --version
