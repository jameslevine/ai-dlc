name: Set up aidlc
description: >-
  Install uv and the aidlc CLI at a pinned version, or from the checkout when
  the platform repository is running its own caller.

inputs:
  version:
    description: >-
      Git ref of the aidlc release to install. Defaults to the ref this action
      was called at: on a release tag that is the pinned release commit, so a
      consumer pinning the platform to a tag gets the CLI from that same tag.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Install aidlc
      shell: bash
      env:
        # `github.action_ref` is the ref this action was called at. The line
        # that calls it in aidlc-ci.yml is marked `# aidlc:pin`, so on a
        # release tag it is the release commit SHA, and the CLI comes from the
        # same pinned commit as every other internal reference. On main it is
        # `main`. Nothing to keep in sync by hand.
        #
        # Verified on a runner, since two earlier attempts were not:
        # `github.job_workflow_ref` is an OIDC claim, not a context property,
        # and `github.job_workflow_sha` is empty for a reusable workflow called
        # from the same repository. Both installed nothing.
        #
        # `github.repository` is the repository the calling workflow runs in,
        # not the one this action lives in. It tells the platform repository
        # apart from a consumer.
        REQUESTED: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        REPOSITORY: ${{ github.repository }}
        PLATFORM_REPOSITORY: jameslevine/ai-dlc
      run: |
        set -euo pipefail
        # Dogfooding. When the platform repository runs its own generated
        # caller, the ref above is the pinned release commit, so `aidlc check`
        # would compare the checkout against a CLI whose packs are one
        # release behind: every push that changes a pack goes red until the
        # next release moves `v1`. Installing from the checkout instead means
        # the commit under test is the one being exercised. An explicit
        # `version` input still wins, since it says exactly what to install.
        # Consumers never take this branch.
        if [ -z "$REQUESTED" ] && [ "$REPOSITORY" = "$PLATFORM_REPOSITORY" ]; then
          echo "Installing aidlc from the checkout at ${GITHUB_WORKSPACE} (platform repository)"
          uv tool install --force "$GITHUB_WORKSPACE"
          aidlc --version
          exit 0
        fi
        ref="${REQUESTED:-${ACTION_REF}}"
        if [ -z "$ref" ]; then
          echo "::error::could not determine which aidlc version to install" >&2
          exit 1
        fi
        echo "Installing aidlc at ${ref}"
        uv tool install "git+https://github.com/jameslevine/ai-dlc@${ref}"
        aidlc --version
